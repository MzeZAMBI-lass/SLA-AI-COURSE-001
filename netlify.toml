# Netlify configuration for SLA Transport System
# Deploys both Next.js frontend and Express API on a single platform.
#
# Architecture:
#   yoursite.netlify.app/          → Next.js (apps/web)
#   yoursite.netlify.app/api/*     → Netlify Function wrapping Express (apps/api)
#   yoursite.netlify.app/webhook   → same Function (WhatsApp webhook receiver)
#   yoursite.netlify.app/health    → same Function (health check)

[build]
  # Build from repo root so the monorepo workspace install works correctly.
  # @netlify/plugin-nextjs finds Next.js via the publish dir (apps/web/.next → parent apps/web/).
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

# Handles Next.js middleware → Netlify Edge Function conversion and SSR support.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Route all API calls and webhook to the Express function.
# Netlify preserves the original request path in event.path, so
# Express receives /api/students, /webhook, etc. exactly as configured.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true
