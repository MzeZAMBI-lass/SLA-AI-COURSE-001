name: SLA Transport E2E Health Check

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 10:00 AM SAST daily
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Run all checks and alert on failure
        run: |
          FAILURES=""

          # 1. LOAD CHECK
          # curl gets SSR HTML — Next.js inputs are client-rendered, so check
          # for the Next.js page marker (_next/static or __NEXT_DATA__) instead.
          HTTP=$(curl -s -o /tmp/login.html -w "%{http_code}" https://sla-transport.netlify.app/login)
          if [ "$HTTP" != "200" ]; then
            FAILURES="${FAILURES}[FAIL] Load check: expected HTTP 200, got ${HTTP}\n"
          elif ! grep -qi '_next\|__NEXT_DATA__' /tmp/login.html; then
            FAILURES="${FAILURES}[FAIL] Load check: page loaded but no Next.js markers found — may be a blank/error page\n"
          else
            echo "Load check: OK (HTTP $HTTP, Next.js markers present)"
          fi

          # 2. REACHABILITY CHECK
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 3 https://sla-transport.netlify.app/)
          if [[ "$HTTP" != "200" && "$HTTP" != "301" && "$HTTP" != "302" ]]; then
            FAILURES="${FAILURES}[FAIL] Reachability check: expected 200/301/302, got ${HTTP}\n"
          else
            echo "Reachability check: OK (HTTP $HTTP)"
          fi

          # 3. INVALID LOGIN CHECK
          AUTH_BODY=$(curl -s -X POST https://sla-transport.netlify.app/api/auth/callback/credentials \
            -H "Content-Type: application/json" \
            -d '{"email":"probe-test@invalid.example","password":"wrong-password-probe","redirect":false,"callbackUrl":"/"}')
          if echo "$AUTH_BODY" | grep -qiE '"url"[[:space:]]*:[[:space:]]*"[^"]*dashboard|"ok"[[:space:]]*:[[:space:]]*true'; then
            FAILURES="${FAILURES}[FAIL] Invalid login check: bad credentials appeared to succeed\n"
          else
            echo "Invalid login check: OK (bad credentials correctly rejected)"
          fi

          # DONE — send email and exit 1 only if there are failures
          if [ -n "$FAILURES" ]; then
            DATE=$(date -u +%Y-%m-%d)
            printf '%s' "$FAILURES" > /tmp/fail.txt
            FAIL_TEXT=$(cat /tmp/fail.txt)
            jq -n \
              --arg from "onboarding@resend.dev" \
              --arg to "intern-shikunzi@silverleaf.co.tz" \
              --arg subject "SLA Transport E2E FAILURE — $DATE" \
              --arg body "Daily health check failed on $DATE:\n\n$FAIL_TEXT\nCheck: https://sla-transport.netlify.app/login" \
              '{from: $from, to: [$to], subject: $subject, text: $body}' > /tmp/email.json

            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/email.json

            echo ""
            echo "FAILURE REPORT:"
            cat /tmp/fail.txt
            exit 1
          else
            echo "OK — all checks passed"
          fi
